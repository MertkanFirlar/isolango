<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Isolango — Oynaya oynaya kelime öğren</title>
<meta name="description" content="Isolango: oyunlaştırılmış dil öğrenme uygulaması. Kelime öğren, adanı büyüt." />
<link rel="stylesheet" href="./style.css" />
</head>
<body>
  <main class="hero">
    <svg class="island" viewBox="0 0 300 300" xmlns="http://www.w3.org/2000/svg" aria-label="Isolango adası">
      <defs>
        <radialGradient id="glow" cx="0.5" cy="0.45" r="0.55">
          <stop offset="0" stop-color="#BDEBDC" stop-opacity="0.8"/>
          <stop offset="1" stop-color="#BDEBDC" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#5BD8B8"/><stop offset="1" stop-color="#12A87F"/>
        </linearGradient>
        <linearGradient id="sand" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFD782"/><stop offset="1" stop-color="#F0A94E"/>
        </linearGradient>
        <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#74D983"/><stop offset="1" stop-color="#45C664"/>
        </linearGradient>
        <radialGradient id="sun" cx="0.5" cy="0.5" r="0.5">
          <stop offset="0" stop-color="#FFE9A8"/><stop offset="1" stop-color="#FFD25E"/>
        </radialGradient>
      </defs>

      <circle cx="150" cy="140" r="140" fill="url(#glow)"/>
      <circle cx="238" cy="66" r="26" fill="url(#sun)"/>

      <!-- deniz tabanı -->
      <ellipse cx="150" cy="210" rx="120" ry="40" fill="url(#sea)" opacity="0.25"/>

      <g transform="translate(150 150)">
        <!-- gölge + kumsal -->
        <ellipse cx="0" cy="62" rx="118" ry="20" fill="#000" opacity="0.06"/>
        <ellipse cx="0" cy="56" rx="116" ry="26" fill="#FFE7B0"/>
        <ellipse cx="0" cy="52" rx="104" ry="22" fill="url(#sand)"/>
        <!-- çimen tepe -->
        <path d="M-96 54 Q 0 -96 96 54 Q 0 78 -96 54 Z" fill="url(#grass)"/>
        <path d="M-52 -10 Q 0 -86 52 -10" stroke="#A6EFAE" stroke-width="5" stroke-linecap="round" fill="none" opacity="0.5"/>

        <!-- ağaçlar -->
        <g transform="translate(-52 6)">
          <rect x="-4" y="-2" width="8" height="24" rx="4" fill="#8A5A34"/>
          <circle cx="0" cy="-10" r="16" fill="#3FAE55"/><circle cx="-9" cy="-1" r="11" fill="#57C86B"/><circle cx="9" cy="-1" r="11" fill="#57C86B"/><circle cx="0" cy="-15" r="13" fill="#57C86B"/>
        </g>
        <g transform="translate(-12 -18) scale(1.1)">
          <rect x="-4" y="-2" width="8" height="24" rx="4" fill="#8A5A34"/>
          <circle cx="0" cy="-10" r="16" fill="#3FAE55"/><circle cx="-9" cy="-1" r="11" fill="#57C86B"/><circle cx="9" cy="-1" r="11" fill="#57C86B"/><circle cx="0" cy="-15" r="13" fill="#57C86B"/>
        </g>
        <!-- palmiye -->
        <g transform="translate(60 2)">
          <path d="M2 24 C -4 2 -2 -16 0 -34" stroke="#9A6A3C" stroke-width="7" fill="none" stroke-linecap="round"/>
          <g fill="#3FAE55">
            <path d="M0 -36 C -28 -44 -44 -34 -50 -24 C -34 -31 -17 -32 0 -36 Z"/>
            <path d="M0 -36 C 28 -44 44 -34 50 -24 C 34 -31 17 -32 0 -36 Z"/>
            <path d="M0 -36 C -14 -62 -5 -78 5 -86 C 2 -66 2 -50 0 -36 Z"/>
            <path d="M0 -36 C 19 -56 36 -56 46 -50 C 29 -51 14 -46 0 -36 Z"/>
          </g>
        </g>

        <!-- açık kitap "A" -->
        <g transform="translate(0 40)">
          <path d="M0 2 C -22 -8 -48 -8 -62 -2 L-62 20 C -48 13 -22 13 0 24 Z" fill="#fff" stroke="#2E8B74" stroke-width="3"/>
          <path d="M0 2 C 22 -8 48 -8 62 -2 L62 20 C 48 13 22 13 0 24 Z" fill="#fff" stroke="#2E8B74" stroke-width="3"/>
          <line x1="-46" y1="4" x2="-14" y2="12" stroke="#9FD6C6" stroke-width="3" stroke-linecap="round"/>
          <text x="34" y="16" font-family="Nunito, sans-serif" font-weight="800" font-size="26" fill="#0E9E76" text-anchor="middle">A</text>
        </g>
      </g>
    </svg>

    <h1 class="brand">Isol<span class="a">a</span>ngo</h1>
    <p class="tagline">Oynaya oynaya kelime öğren 🏝️</p>
    <p class="sub">Learn languages by playing — grow your island.</p>

  </main>
</body>
</html>
